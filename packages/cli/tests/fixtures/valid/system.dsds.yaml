schemaVersion: "0.22.0"

name: Test System

entries:
  - kind: component
    id: test-button
    name: Test Button
    description: A schema-valid component for dsds-cli tests.
    metadata:
      tags: [action]
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        items:
          - level: should
            statement: Use for actions the user takes, not for navigation.
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: must
            statement: Give every Test Button an accessible name.
    imports:
      - platform: react
        code: import { TestButton } from '@test/ui'
        package: "@test/ui"
    traits:
      - traitType: variant
        kind: enum
        id: tone
        description: The Test Button's semantic tone.
        values:
          - id: default
            description: Neutral. The everyday case.
          - id: critical
            description: Red. Destructive actions.

  - kind: component
    id: test-card
    name: Test Card
    description: A schema-valid surface for dsds-cli tests.
    metadata:
      tags: [layout]
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: should
            statement: Keep a Test Card's content to one subject.
    uses:
      - to: test-button
        role: Its action affordance

  - kind: sanity.chunk
    id: test-chunk
    name: Test Chunk
    description: A schema-valid chunk for dsds-cli tests.
    metadata:
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: must
            statement: Use only in dsds-cli tests.
    refs:
      - href: ./test-chunk.tsx
        rel: source

  - kind: sanity.pattern
    id: test-pattern
    name: Test Pattern
    description: A pattern used by the test suite.
    metadata:
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: should
            statement: Compose a Test Pattern from Test Button and Test Card.

  - kind: token
    id: test-tokens
    name: Test Tokens
    description: A test dimension scale.
    metadata:
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: how-to-use
        items:
          - level: must
            statement: Use the scale rather than raw pixel values.
    tokenType: dimension
