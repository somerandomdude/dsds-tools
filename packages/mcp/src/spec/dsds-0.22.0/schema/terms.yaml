# The house vocabulary, in one place.
#
# Measured across the schema, the root docs, the site and the skills, DSDS already has one
# winning term per concept - entry (348), section (252), kind (200 vs 19 for "type"), field
# (185 vs 20 for "property"), document (194). The problem was never that people disagreed; it
# was that nothing wrote the decision down, so the losing synonym kept reappearing: the skills
# called a document a "spec" 32 times, and the schema used "tool" 38 times for what the
# Conformance page calls a conforming consumer.
#
# scripts/generate/sync-terms.mjs renders this into README.md, AGENTS.md and the Conformance
# page, the same way interop-map.yaml feeds the interoperability table. `npm run check` fails if
# any of the three drifts from this file.
#
#   use     the term to use
#   for     what it means
#   not     the synonyms it beats, comma-separated - what a reviewer should flag
#   where   optional; where the term is defined, if it's defined somewhere specific

- use: entry
  for: One documented thing in the design system graph - a component, token, theme, or anything else.
  not: entity, record, item, node
  where: "`entries/entry.schema.yaml`"

- use: document
  for: One `.dsds.yaml` or `.dsds.json` file, whether it holds a whole system or a single entry.
  not: spec, spec file, doc
  where: "`base.schema.yaml`"

- use: spec
  for: The DSDS specification itself - this repo, the schema files, and the site that publishes them.
  not: (never a document)

- use: section
  for: One member of an entry's `sections[]`.
  not: block, documentBlock, chunk
  where: "`sections/section.schema.yaml`"

- use: field
  for: A named slot on an object.
  not: property, key, attribute
  where: "(property table is the one allowed exception - it names the generated tables)"

- use: kind
  for: The discriminator value that says which shape an entry or section is.
  not: type, variant
  where: "`entry.kind`, `section.kind`"

- use: item
  for: One member of a section's `items[]`.
  not: entry, rule, criterion

- use: conforming consumer
  for: Anything that reads a document - a renderer, an agent, a site generator.
  not: tool, reader, client, parser, renderer
  where: "[Conformance](https://designsystemdocspec.org/conformance#conformance-classes)"

- use: conforming producer
  for: Anything that writes a document.
  not: generator, author tool, writer
  where: "[Conformance](https://designsystemdocspec.org/conformance#conformance-classes)"

- use: conforming validator
  for: Anything that checks a document against the schema and the rule catalog.
  not: linter, checker
  where: "[Conformance](https://designsystemdocspec.org/conformance#conformance-classes)"
