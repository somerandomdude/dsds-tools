# The one interoperability map. README.md, AGENTS.md and the site's Interoperability page each
# printed their own copy of this table, with different column headers, different wording, and
# different numbers of rows - the site page carried three integrations the other two didn't.
# scripts/generate/sync-interop-map.mjs renders this file into all three.
#
# Each row is three markdown cells, stored rendered rather than reassembled from parts: a cell
# can hold a link, a parenthetical, inline code or an em dash, and the layout varies enough
# between rows that reconstructing it would cost more than it saves.
#
#   layer   what this line of the system is about
#   format  the format that owns it
#   field   the DSDS field that points at it
#
# Column order differs per surface (README and AGENTS.md lead with the format, the site page
# leads with the layer); the generator owns that. Everything else lives here.

- layer: Token values, types, aliases
  format: "[DTCG](https://www.w3.org/community/reports/design-tokens/CG-FINAL-format-20251028/) (W3C Design Tokens)"
  field: "A token entry's `source`; a theme's `source`"

- layer: Component API contract, already generated
  format: "[Custom Elements Manifest](https://github.com/webcomponents/custom-elements-manifest) (CEM), or any standard contract document"
  field: "A component's `specs` (`rel: contract`)"

- layer: Component source, per platform
  format: "`.tsx`, `.vue`, `.swift`, framework typings — whatever a generator reads"
  field: "A component's `sourceFiles`"

- layer: Stories and live demos
  format: "[Component Story Format](https://storybook.js.org/docs/api/csf) (CSF), Storybook, or an equivalent"
  field: "A `refs`/`examples` entry with `rel: storybook`"

- layer: Whether a guideline actually holds
  format: A test or lint rule — vitest, axe-core, stylelint, ESLint
  field: "A guideline's `checks` (`rel: test`, `rel: lint-rule`)"

- layer: Why a guideline exists
  format: WCAG, ARIA APG, MDN, an internal RFC
  field: "A guideline's `evidence` (`rel: external-link`)"

- layer: Design artifacts
  format: Figma or another design tool
  field: "A `refs` entry with `rel: design`, or `metadata.preview`"

- layer: Distribution
  format: npm, or any package registry
  field: "A component's `imports[].package`, or `rel: package`"

- layer: Editor validation of the DSDS file itself
  format: "[JSON Schema](https://json-schema.org/) draft 2020-12"
  field: "The document's own `$schema` key"

- layer: Anything not listed
  format: Any vendor or tool
  field: "`$extensions`, keyed by namespace"
