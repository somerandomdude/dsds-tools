$schema: https://json-schema.org/draft/2020-12/schema
$id: https://designsystemdocspec.org/v0.21.0/common/id.schema.yaml
title: Id
type: string
description: >-
  Lowercase, dash-separated segments, optionally chained with dots. A section
  item's own `id` is optional, but a conforming consumer MUST
  be able to address every item. When an item has no `id`,
  consumers MUST derive one from the item's own text so content has a
  consistent id. The `$comment` below gives the exact derivation.
$comment: >-
  An id from an outside tool that doesn't fit this format goes under
  `$extensions.<namespace>.displayName` instead.

  An agent citing "why did you do that" needs something to cite, and same-as/refines/checks all point at an item by id. To derive one: lowercase the item's own primary text field (a definitions item's `term`, a guidelines item's `statement`, a steps item's or freeform entry's `title`), replace each run of characters outside `[a-z0-9]` with a single dash, then trim any leading or trailing dash.
pattern: '^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+(-[a-z0-9]+)*)*$'
example: color.action.primary
$defs:
  tokenId:
    type: string
    description: The same as the base id format, but a segment can also be separated by a slash.
    $comment: Only for token entries. Their id often comes from a design tool that names paths that way.
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*([./][a-z0-9]+(-[a-z0-9]+)*)*$'
    example: color/action/primary
  namespaced:
    type: string
    description: A dotted, namespaced custom value. The open extension point alongside a fixed set of well-known values.
    $comment: Same lowercase-dash-per-segment format as the base id, but requires at least one dot. This is so a custom value can't collide with existing ids.
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+(-[a-z0-9]+)*)+$'
    example: acme.icon-library
